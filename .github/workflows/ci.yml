name: CI
on:
  push:
  pull_request:
jobs:
  test:
    # Pinned: ubuntu-latest became 26.04 (Nov 2026), whose pg_dump/pg_restore are newer than the PostgreSQL 16
    # server and write settings 16 rejects (restore drill test). 24.04 ships the 16 client tools.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zacc_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zacc_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
