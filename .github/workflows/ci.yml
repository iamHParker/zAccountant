name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zacc_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zacc_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # pg_dump / pg_restore must match the PostgreSQL 16 server (a newer runner client writes settings 16 rejects).
      - run: sudo apt-get install -y postgresql-client-16 && echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
