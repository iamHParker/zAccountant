# Railway deployment (Section 14.1). Not used until sign-in (Sprint 1) exists:
# src/server.js refuses to start without ZACC_DEV_MODE=1.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node src/server.js"
healthcheckPath = "/readyz"
healthcheckTimeout = 30
numReplicas = 2
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
