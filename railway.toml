# Railway deployment (Section 14.1). Setup steps for a new environment: docs/runbooks/railway-setup.md
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node src/server.js"
healthcheckPath = "/readyz"
healthcheckTimeout = 60
# One copy for the alpha: the sign-in rate limits and the nightly books check live in the server's memory.
# Going to 2+ needs a shared store (Redis) for the limits and a separate cron service for the nightly job.
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
